<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 透明背景，预留约 10% 外边距以适配宿主裁剪 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 连接线 -->
    <path d="M64 38 V56 M64 56 H32 V76 M64 56 H96 V76 M64 56 V76" stroke="#38BDF8" stroke-width="5.5"/>
    <!-- 根节点 -->
    <rect x="44" y="16" width="40" height="24" rx="7" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3"/>
    <circle cx="55" cy="28" r="3.5" fill="#FFFFFF"/>
    <line x1="63" y1="28" x2="76" y2="28" stroke="#FFFFFF" stroke-width="3"/>
    <!-- 左子节点 -->
    <rect x="16" y="76" width="32" height="24" rx="6" fill="#10B981" stroke="#D1FAE5" stroke-width="2.5"/>
    <circle cx="25" cy="88" r="3" fill="#FFFFFF"/>
    <line x1="32" y1="88" x2="41" y2="88" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- 中子节点 -->
    <rect x="48" y="76" width="32" height="24" rx="6" fill="#6366F1" stroke="#E0E7FF" stroke-width="2.5"/>
    <circle cx="57" cy="88" r="3" fill="#FFFFFF"/>
    <line x1="64" y1="88" x2="73" y2="88" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- 右子节点 -->
    <rect x="80" y="76" width="32" height="24" rx="6" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2.5"/>
    <circle cx="89" cy="88" r="3" fill="#FFFFFF"/>
    <line x1="96" y1="88" x2="105" y2="88" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- 底部进度条示意 -->
    <rect x="24" y="108" width="80" height="6" rx="3" fill="#475569" opacity="0.45"/>
    <rect x="24" y="108" width="52" height="6" rx="3" fill="#38BDF8"/>
  </g>
</svg>
